# 正式部署：把线上 cf-server-monitor 从 2.8.4 Beta1 升到上游 2.8.6 Beta2
# - triggers 必须与线上现状完全一致（免费版账号 cron 配额已满，不能新增/减少）
# - keep_vars = true：保留现有 API_SECRET 与其它变量，避免探针集体失效
name = "cf-server-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# 与线上当前配置保持一致：每分钟（离线检测/资源告警/流量报告）+ 每小时（到期检测、周日表轮换）
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "2a771a0b-d07d-44b1-910b-a219da84e8b3"

[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]